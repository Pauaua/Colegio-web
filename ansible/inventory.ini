# Inventario de las instancias EC2 del Auto Scaling Group (subredes privadas).
# Regenérelo con ./generar_inventario.sh después de `terraform apply` o cuando el ASG cambie de instancias.
# Las IP de abajo son de ejemplo.

[gestor_documental]
10.20.10.25
10.20.11.37

[gestor_documental:vars]
ansible_user=ec2-user
ansible_python_interpreter=/usr/bin/python3

# --- Opción A: conexión por AWS Systems Manager (sin SSH ni bastión) ------------
# Requiere la colección community.aws, el plugin Session Manager de AWS CLI y un bucket para la transferencia.
# El inventario debe listar los instance-id (./generar_inventario.sh --ssm):
# i-0123456789abcdef0
# i-0fedcba9876543210
# [gestor_documental:vars]
# ansible_connection=community.aws.aws_ssm
# ansible_aws_ssm_region=us-east-1
# ansible_aws_ssm_bucket_name=<bucket-del-proyecto>
# ansible_python_interpreter=/usr/bin/python3

# --- Opción B: SSH a través de un bastión en la subred pública (ProxyJump) -------
# Requiere key_name en Terraform y un bastión con acceso a la VPC.
# [gestor_documental:vars]
# ansible_user=ec2-user
# ansible_ssh_private_key_file=~/.ssh/chorombo.pem
# ansible_ssh_common_args='-o ProxyJump=ec2-user@<ip-publica-bastion> -o StrictHostKeyChecking=accept-new'
