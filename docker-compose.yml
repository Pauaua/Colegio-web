# Entorno de desarrollo local: MySQL 8 (equivalente a Amazon RDS MySQL) y MinIO (equivalente a Amazon S3).
services:
  mysql:
    image: mysql:8.0
    container_name: chorombo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gestor_documental
      MYSQL_USER: gestor
      MYSQL_PASSWORD: gestor
      TZ: America/Santiago
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  # MinIO dejó de publicar imágenes gratuitas en Docker Hub (minio/minio); se usa la compilación
  # de Chainguard, hecha desde el código fuente oficial de MinIO y que incluye el cliente mc.
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: chorombo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Crea el bucket de documentos al iniciar (equivalente local al bucket S3 privado).
  minio-init:
    image: cgr.dev/chainguard/minio:latest
    container_name: chorombo-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/chorombo-documentos-local &&
      mc version enable local/chorombo-documentos-local &&
      mc anonymous set none local/chorombo-documentos-local &&
      echo 'Bucket chorombo-documentos-local listo'
      "
    restart: "no"

volumes:
  mysql_data:
  minio_data:
